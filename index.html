<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Healing Fairee</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: url('beach.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #ffffff;
    }

    /* Transparent Navigation Header */
    header {
      width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent; /* Completely invisible banner */
    }

    .logo-link {
      color: #ffffff;
      text-decoration: none;
      font-size: 1.5rem;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* Nav Buttons with Hover Effects */
    .nav-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
      transition: all 0.3s ease;
      display: inline-block;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .nav-btn:hover {
      background-color: #ffffff;
      color: #222222;
      text-shadow: none;
    }

    /* Dropdown Styling */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      background-color: #ffffff;
      min-width: 230px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
      border-radius: 8px;
      overflow: hidden;
      margin-top: 8px;
      z-index: 10;
    }

    .dropdown-content a {
      color: #222222;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      font-size: 0.95rem;
      font-weight: 500;
      text-shadow: none;
      transition: background-color 0.2s;
    }

    .dropdown-content a:hover {
      background-color: #f1f1f1;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    /* Main Container */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      width: 100%;
    }

    .subscribe-box {
      background-color: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(4px);
      padding: 40px 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .subscribe-box h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .subscribe-box p {
      font-size: 0.95rem;
      margin-bottom: 25px;
      line-height: 1.5;
      color: #e0e0e0;
    }

    .signup-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .signup-form input[type="email"] {
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 6px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      outline: none;
    }

    .signup-form input[type="email"]::placeholder {
      color: #888888;
    }

    .signup-form button {
      padding: 14px;
      border: none;
      border-radius: 6px;
      background-color: #ffffff;
      color: #222222;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
