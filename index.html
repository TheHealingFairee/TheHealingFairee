<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Healing Fairee</title>
  <style>
    /* Custom Font Setup */
    @font-face {
      font-family: 'Valley Sans';
      src: url('Valley_Sans%20font/ValleySans-VariableFont_wght.ttf') format('truetype'),
           url('Valley_Sans font/ValleySans-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: url('/TheHealingFairee/images/beach.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #ffffff;
    }

    /* Shared Header Layout */
    header#main-header {
      width: 100%;
      padding: 20px 40px;
      display: flex !important;
      flex-direction: row !important;
      justify-content: space-between !important;
      align-items: center !important;
      background: transparent;
    }

    .logo-link {
      font-family: 'Valley Sans', 'Segoe UI', sans-serif;
      font-size: 2.2rem;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      margin-right: auto;
    }

    .main-nav {
      display: flex !important;
      align-items: center;
      gap: 15px;
      margin-left: auto;
    }

    .nav-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      transition: all 0.3s ease;
      display: inline-block;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .nav-btn:hover {
      background-color: rgba(0, 0, 0, 0.75);
      color: #ffffff;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      height: 12px;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background-color: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      box-shadow: 0px 8px 16px rgba(0,0,0,0.4);
      border-radius: 8px;
      overflow: hidden;
      z-index: 10;
      white-space: nowrap;
    }

    .dropdown-content a {
      color: #ffffff;
      padding: 12px 20px;
      text-decoration: none;
      display: block;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .dropdown-content a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    /* Main Container */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      width: 100%;
    }

    .subscribe-box {
      background-color: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(2px);
      padding: 55px 50px;
      border-radius: 12px;
      text-align: center;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .subscribe-box h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .subscribe-box p {
      font-size: 0.95rem;
      margin-bottom: 25px;
      line-height: 1.5;
      color: #ffffff; /* Updated to Pure White */
    }

    .signup-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .signup-form input[type="email"] {
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 6px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      outline: none;
    }

.signup-form button {
  border: 2px solid #333333; 
  background-color: #9d44d4;
  color: #ffffff;
  padding: 14px;
  border-radius: 25px;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  transition: background-color 0.2s, border-color 0.2s;
}

.signup-form button:hover {
  background-color: #8220c7; /* Darker purple on hover */
}

    #form-status {
      margin-top: 15px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header id="main-header"></header>

  <main>
    <div class="subscribe-box">
      <h1>Subscribe to Find Inner Peace</h1>
      <p>Want to receive emails with journaling prompts, workbooks, and information about healing workshops?</p>
      
      <form class="signup-form" id="email-form">
        <input type="email" name="email" placeholder="Email Address" required />
        <input type="hidden" name="source" value="Landing Page" />
        <button type="submit" id="submit-btn">Sign Up</button>
      </form>
      <div id="form-status"></div>
    </div>
  </main>

  <script>
    fetch('nav.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('main-header').innerHTML = data;
      });
  </script>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzZpYCmbm8HMrDWLxmPxR61w7UIcCatZX8m4QJHPRXul2dm0ru-qG4NvkD5gasDJz412g/exec';

    const form = document.getElementById('email-form');
    const statusDiv = document.getElementById('form-status');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', e => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting...';

      const formData = new FormData(form);
      const urlEncoded = new URLSearchParams(formData).toString();

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: urlEncoded
      })
      .then(() => {
        statusDiv.innerText = 'Thank you for subscribing!';
        statusDiv.style.color = '#a3ffb4';
        form.reset();
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign Up';
      })
      .catch(() => {
        statusDiv.innerText = 'Something went wrong. Please try again.';
        statusDiv.style.color = '#ff9e9e';
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign Up';
      });
    });
  </script>

</body>
</html>
