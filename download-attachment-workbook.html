<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Your Workbook | The Healing Fairee</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: url('attachment-bg.png') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }

    .download-box {
      background-color: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      padding: 50px 40px;
      border-radius: 16px;
      text-align: center;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }

    .download-link {
      display: inline-block;
      font-size: 2rem;
      font-weight: bold;
      color: #ffffff;
      text-decoration: underline;
      transition: opacity 0.2s;
    }

    .download-link:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="download-box">
    <a href="attachment-style-workbook.pdf" download class="download-link">Click Here to Download your PDF</a>
  </div>

</body>
</html>
