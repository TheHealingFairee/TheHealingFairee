<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Your Workbook | The Healing Fairee</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: url('attachment-bg.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #ffffff;
    }

   /* Transparent Navigation Header */
    header {
      width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
    }

    .logo-link {
      color: #ffffff;
      text-decoration: none;
      font-size: 1.5rem;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* Transparent Black Nav Buttons */
    .nav-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      transition: all 0.3s ease;
      display: inline-block;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .nav-btn:hover {
      background-color: rgba(0, 0, 0, 0.75);
      color: #ffffff;
    }

    /* Dropdown Styling */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    /* Invisible bridge to prevent dropdown from disappearing */
    .dropdown::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      height: 12px;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      box-shadow: 0px 8px 16px rgba(0,0,0,0.4);
      border-radius: 8px;
      overflow: hidden;
      z-index: 10;
      white-space: nowrap;
    }

    .dropdown-content a {
      color: #ffffff;
      padding: 12px 20px;
      text-decoration: none;
      display: block;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .dropdown-content a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      width: 100%;
    }

    .download-container {
      text-align: center;
      max-width: 650px;
      width: 100%;
    }

    .download-link {
      display: inline-block;
      font-size: 2.2rem;
      font-weight: bold;
      color: #ffffff;
      text-decoration: underline;
      transition: opacity 0.2s, transform 0.2s;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .download-link:hover {
      opacity: 0.85;
      transform: scale(1.02);
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo-link">The Healing Fairee</a>
    <nav>
      <a href="index.html#blog" class="nav-btn">Blog</a>
      
      <div class="dropdown">
        <a href="#freebies" class="nav-btn">Freebies</a>
        <div class="dropdown-content">
          <a href="attachment-workbook.html">Attachment Styles Workbook</a>
        </div>
      </div>

      <a href="index.html#about" class="nav-btn">About Me</a>
    </nav>
  </header>

  <main>
    <div class="download-container">
      <a href="How to Heal Attachment Styles Workbook.pdf" download class="download-link">Click Here to Download your PDF</a>
    </div>
  </main>

</body>
</html>
