<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Your Workbook | The Healing Fairee</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: url('attachment-bg.png') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      padding: 20px;
    }

    .download-container {
      text-align: center;
      max-width: 650px;
      width: 100%;
    }

    .download-link {
      display: inline-block;
      font-size: 2.2rem;
      font-weight: bold;
      color: #ffffff;
      text-decoration: underline;
      transition: opacity 0.2s, transform 0.2s;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .download-link:hover {
      opacity: 0.85;
      transform: scale(1.02);
    }
  </style>
</head>
<body>

  <div class="download-container">
    <a href="How to Heal Attachment Styles Workbook.pdf" download class="download-link">Click Here to Download your PDF</a>
  </div>

</body>
</html>
