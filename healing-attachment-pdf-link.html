<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Your Workbook | The Healing Fairee</title>
  <style>
    /* Custom Font Setup */
    @font-face {
      font-family: 'Valley Sans';
      src: url('Valley_Sans%20font/ValleySans-VariableFont_wght.ttf') format('truetype'),
           url('Valley_Sans font/ValleySans-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: url('/images/attachment-styles-soulmates-background.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #ffffff;
    }

    /* Shared Header Layout */
    header#main-header {
      width: 100%;
      padding: 20px 40px;
      display: flex !important;
      flex-direction: row !important;
      justify-content: space-between !important;
      align-items: center !important;
      background: transparent;
    }

    .logo-link {
      font-family: 'Valley Sans', 'Segoe UI', sans-serif;
      font-size: 2.2rem;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      margin-right: auto;
    }

    .main-nav {
      display: flex !important;
      align-items: center;
      gap: 15px;
      margin-left: auto;
    }

    /* Transparent Black Nav Buttons */
    .nav-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      transition: all 0.3s ease;
      display: inline-block;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .nav-btn:hover {
      background-color: rgba(0, 0, 0, 0.75);
      color: #ffffff;
    }

    /* Dropdown Styling */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      height: 12px;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      box-shadow: 0px 8px 16px rgba(0,0,0,0.4);
      border-radius: 8px;
      overflow: hidden;
      z-index: 1000;
      white-space: nowrap;
    }

    .dropdown-content a {
      color: #ffffff;
      padding: 12px 20px;
      text-decoration: none;
      display: block;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .dropdown-content a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    /* Download Page Layout */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      width: 100%;
    }

    .download-container {
      text-align: center;
      max-width: 650px;
      width: 100%;
    }

    .download-link {
      display: inline-block;
      font-size: 2.2rem;
      font-weight: bold;
      color: #ffffff;
      text-decoration: underline;
      transition: opacity 0.2s, transform 0.2s;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .download-link:hover {
      opacity: 0.85;
      transform: scale(1.02);
    }

/* Shared Mobile Responsive Layout Fixes */
    @media (max-width: 768px) {
      header#main-header {
        flex-direction: column !important;
        align-items: center !important;
        padding: 15px 20px !important;
        gap: 12px;
      }

      .logo-link {
        font-size: 1.8rem !important;
        margin-right: 0 !important;
        text-align: center;
      }

      .main-nav {
        margin-left: 0 !important;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .nav-btn {
        font-size: 0.92rem !important;
        padding: 7px 16px !important;
      }

      /* Centers the Freebies dropdown so text isn't cut off on the left */
      .dropdown-content {
        left: 50% !important;
        right: auto !important;
        transform: translateX(-50%);
        min-width: 250px;
        text-align: center;
        z-index: 1000;
      }

      main {
        padding: 20px 15px !important;
      }
    }
    
  </style>
</head>
<body>

  <header id="main-header"></header>

  <main>
    <div class="download-container">
      <a href="How to Heal Attachment Styles Workbook.pdf" download class="download-link">Click Here to Download your PDF</a>
    </div>
  </main>

  <script>
    fetch('nav.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('main-header').innerHTML = data;
      });
  </script>

</body>
</html>
