<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Budget Spreadsheet — The Healing Fairee</title>

  <style>
    /* Custom Font Setup */
    @font-face {
      font-family: 'Valley Sans';
      src: url('Valley_Sans%20font/ValleySans-VariableFont_wght.ttf') format('truetype'),
           url('Valley_Sans font/ValleySans-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
    }

    /* Universal Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Main Page Body Background & Flex Layout */
    body {
      background: url('/TheHealingFairee/images/Money-Tree.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #ffffff;
    }

    /* Shared Navigation Header Container */
    header#main-header {
      width: 100%;
      padding: 20px 40px;
      display: flex !important;
      flex-direction: row !important;
      justify-content: space-between !important;
      align-items: center !important;
      background: transparent;
    }

    .logo-link {
      font-family: 'Valley Sans', 'Segoe UI', sans-serif;
      font-size: 2.2rem;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      margin-right: auto;
    }

    .main-nav {
      display: flex !important;
      align-items: center;
      gap: 15px;
      margin-left: auto;
    }

    .nav-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      transition: all 0.3s ease;
      display: inline-block;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .nav-btn:hover {
      background-color: rgba(0, 0, 0, 0.75);
      color: #ffffff;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      height: 12px;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
      box-shadow: 0px 8px 16px rgba(0,0,0,0.4);
      border-radius: 8px;
      overflow: hidden;
      z-index: 10;
      white-space: nowrap;
    }

    .dropdown-content a {
      color: #ffffff;
      padding: 12px 20px;
      text-decoration: none;
      display: block;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .dropdown-content a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    /* Main Content Wrapper */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      width: 100%;
    }

    .content-container {
      text-align: center;
      max-width: 650px;
      width: 100%;
      padding: 20px;
    }

    .content-container h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
      line-height: 1.3;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
    }

    .content-container p {
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 30px; /* Provides spacing above the button */
      color: #ffffff;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
    }

    .oval-btn {
      padding: 16px 40px;
      border: none;
      border-radius: 50px;
      background-color: #ffffff;
      color: #222222;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .oval-btn:hover {
      background-color: #f0f0f0;
      transform: scale(1.03);
    }

    /* Popup Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-box {
      background: #ffffff;
      color: #222222;
      padding: 35px 30px;
      border-radius: 12px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 18px;
      font-size: 1.5rem;
      cursor: pointer;
      color: #666;
    }

    .modal-box h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #111;
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal-form input[type="email"] {
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
    }

    .modal-form button {
      padding: 14px;
      border: none;
      border-radius: 6px;
      background-color: #222222;
      color: #ffffff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-form button:hover {
      background-color: #444444;
    }
  </style>
</head>
<body>

  <!-- Dynamic Header Container -->
  <header id="main-header"></header>

  <!-- Main Content Region -->
  <main>
    <div class="content-container">
      <h1>Free Budget Spreadsheet</h1>
      <p>I made this free budget spreadsheet for anyone to use, because I think learning how to get a handle of your money should always be free! Instructions for how to use it are found within the spreadsheet. Here’s to financial freedom 😊</p>
      
      <button class="oval-btn" id="open-modal-btn">Download the Google Sheets Template</button>
    </div>
  </main>

  <!-- Hidden Email Modal Overlay -->
  <div class="modal-overlay" id="email-modal">
    <div class="modal-box">
      <span class="close-btn" id="close-modal-btn">&times;</span>
      <h2>Yes, send me the free spreadsheet!</h2>
      
      <form class="modal-form" id="workbook-form">
        <input 
          type="email" 
          name="email" 
          placeholder="Enter your email to receive your download" 
          required 
        />
        <input type="hidden" name="source" value="Budget Spreadsheet" />
        <button type="submit" id="submit-btn">Submit</button>
      </form>
    </div>
  </div>

  <!-- JavaScript: Fetch Nav Header -->
  <script>
    fetch('nav.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('main-header').innerHTML = data;
      });
  </script>

  <!-- JavaScript: Modal Interactivity & Form Submission Logic -->
  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzZpYCmbm8HMrDWLxmPxR61w7UIcCatZX8m4QJHPRXul2dm0ru-qG4NvkD5gasDJz412g/exec';

    const modal = document.getElementById('email-modal');
    const openBtn = document.getElementById('open-modal-btn');
    const closeBtn = document.getElementById('close-modal-btn');
    const form = document.getElementById('workbook-form');
    const submitBtn = document.getElementById('submit-btn');

    // Open Modal
    openBtn.addEventListener('click', () => modal.style.display = 'flex');
    
    // Close Modal
    closeBtn.addEventListener('click', () => modal.style.display = 'none');
    
    // Close Modal when clicking background overlay
    window.addEventListener('click', (e) => {
      if (e.target === modal) modal.style.display = 'none';
    });

    // Form Submission Handler
    form.addEventListener('submit', e => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting...';

      const formData = new FormData(form);
      const urlEncoded = new URLSearchParams(formData).toString();

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: urlEncoded
      })
      .then(() => {
        // Redirect to download page after email is submitted
        window.location.href = 'budget-spreadsheet-download.html';
      })
      .catch(() => {
        // Fallback redirect
        window.location.href = 'budget-spreadsheet-download.html';
      });
    });
  </script>

</body>
</html>
