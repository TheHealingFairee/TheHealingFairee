<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Template is Ready — The Healing Fairee</title>

  <style>
    @font-face {
      font-family: 'Valley Sans';
      src: url('Valley_Sans%20font/ValleySans-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: url('/images/beach.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #ffffff;
    }

    header#main-header {
      width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      width: 100%;
    }

    .download-card {
      background-color: #ffffff;
      color: #2c2c2c;
      border-radius: 16px;
      padding: 40px;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .download-title {
      font-size: 2.2rem;
      color: #1a1a1a;
      margin-bottom: 12px;
      font-family: 'Valley Sans', 'Segoe UI', sans-serif;
    }

    .download-description {
      font-size: 1.05rem;
      color: #555555;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .copy-btn {
      display: inline-block;
      background-color: #b75aff;
      color: #ffffff !important;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 16px 32px;
      border-radius: 30px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(183, 90, 255, 0.4);
      transition: background-color 0.2s, transform 0.2s;
    }

    .copy-btn:hover {
      background-color: #8c26d4;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <header id="main-header"></header>

  <main>
    <div class="download-card">
      <h1 class="download-title">You're All Set!</h1>
      <p class="download-description">Click the button below to save a copy of the budget spreadsheet directly into your Google Drive account.</p>

      <!-- Force-copy link opens Google prompt -->
      <a href="https://docs.google.com/spreadsheets/d/1CmNKIZuktPJHNt8CQ_woCVv6ufEHfpLA/copy" target="_blank" class="copy-btn">
        Access Budget Template ↗
      </a>
    </div>
  </main>

  <script>
    fetch('nav.html?v=1')
      .then(res => res.text())
      .then(data => { document.getElementById('main-header').innerHTML = data; });
  </script>

</body>
</html>
