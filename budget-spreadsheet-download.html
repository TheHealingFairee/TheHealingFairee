<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Template is Ready — The Healing Fairee</title>

  <style>
    /* Custom Font Setup */
    @font-face {
      font-family: 'Valley Sans';
      src: url('Valley_Sans%20font/ValleySans-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: url('/TheHealingFairee/images/beach.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #ffffff;
    }

    /* Shared Header Layout */
    header#main-header {
      width: 100%;
      padding: 20px 40px;
      display: flex !important;
      flex-direction: row !important;
      justify-content: space-between !important;
      align-items: center !important;
      background: transparent;
    }

    .logo-link {
      font-family: 'Valley Sans', 'Segoe UI', sans-serif;
      font-size: 2.2rem;
      font-weight: 600;
      color: #ffffff !important;
      text-decoration: none;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      margin-right: auto;
    }

    .main-nav {
      display: flex !important;
      align-items: center;
      gap: 15px;
      margin-left: auto;
    }

    /* Transparent Black Nav Buttons */
    .nav-btn {
      color: #ffffff !important;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      transition: all 0.3s ease;
      display: inline-block;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .nav-btn:hover {
      background-color: rgba(0, 0, 0, 0.75);
      color: #ffffff !important;
    }

    /* Dropdown Styling */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      height: 12px;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background-color: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      box-shadow: 0px 8px 16px rgba(0,0,0,0.4);
      border-radius: 8px;
      overflow: hidden;
      z-index: 10;
      white-space: nowrap;
    }

    .dropdown-content a {
      color: #ffffff !important;
      padding: 12px 20px;
      text-decoration: none;
      display: block;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .dropdown-content a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    /* Main Container Card */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      width: 100%;
    }

    .download-card {
      background-color: #ffffff;
      color: #2c2c2c;
      border-radius: 16px;
      padding: 40px;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .download-title {
      font-size: 2.2rem;
      color: #1a1a1a;
      margin-bottom: 12px;
      font-family: 'Valley Sans', 'Segoe UI', sans-serif;
    }

    .download-description {
      font-size: 1.05rem;
      color: #555555;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .copy-btn {
      display: inline-block;
      background-color: #b75aff;
      color: #ffffff !important;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 16px 32px;
      border-radius: 30px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(183, 90, 255, 0.4);
      transition: background-color 0.2s, transform 0.2s;
    }

    .copy-btn:hover {
      background-color: #8c26d4;
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      header#main-header {
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>

  <header id="main-header"></header>

  <main>
<main>
    <div class="download-card">
      <h1 class="download-title">You're All Set!</h1>
      <p class="download-description">Click the button below to save a copy of the budget spreadsheet directly into your Google Drive account.</p>

      <a href="https://docs.google.com/spreadsheets/d/1NfA5Vr_D8YY8iRVIkX9HeDKw8279iFo94hglpGbj8to/copy" target="_blank" class="copy-btn">
        Access Budget Template ↗
      </a>
    </div>
  </main>
